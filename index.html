<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Cup · Lake Placid</title>
  <meta name="description" content="The next FIS Alpine and Cross-Country World Cup race, in Eastern Time.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7eef2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="World Cup">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <path fill="currentColor" d="M32 4l3.2 18.2L52 14.8 41.2 29.2 60 32l-18.8 2.8L52 49.2 35.2 41.8 32 60l-3.2-18.2L12 49.2l10.8-14.4L4 32l18.8-2.8L12 14.8l16.8 7.4z"/>
      </svg>
      World Cup
    </h1>
    <p class="sub">Alpine and cross-country · 2026/27 · Eastern Time</p>
  </header>
  <main>
    <p id="preview" class="preview" hidden></p>
    <div class="filters">
      <div class="chips" id="sport" role="group" aria-label="Sport">
        <button type="button" data-filter="alpine" aria-pressed="true">Alpine</button>
        <button type="button" data-filter="xc" aria-pressed="true">Cross-country</button>
      </div>
      <div class="chips" id="gender" role="group" aria-label="Gender">
        <button type="button" data-filter="men" aria-pressed="true">Men</button>
        <button type="button" data-filter="women" aria-pressed="true">Women</button>
      </div>
    </div>
    <section id="hero" aria-live="polite"><p class="empty">Loading the next race…</p></section>
    <section id="upcoming" aria-label="Upcoming races"></section>
    <div class="past-wrap">
      <button type="button" id="past-toggle" aria-expanded="false">Past results</button>
      <section id="past" hidden></section>
    </div>
    <noscript><p class="empty">JavaScript draws the next race and hides the ones already run.</p></noscript>
  </main>
  <footer>
    <p>Clocks are Eastern Time, for Lake Placid. Dates and start times are the FIS World Cup calendars and database. Time TBA means FIS has not published a start time. Add to calendar saves that race as an .ics file.</p>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
